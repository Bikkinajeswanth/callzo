services:
  mock-api:
    build:
      context: ./mock-api
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-callzo}/mock-api:latest
    container_name: callzo-mock-api
    restart: always
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - callzo-admin-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    # Supports pre-built published image from Docker Hub per Section 6
    image: ${DOCKER_HUB_USERNAME:-callzo}/usage-admin-console:latest
    container_name: callzo-admin-console
    restart: always
    depends_on:
      mock-api:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=/api
    networks:
      - callzo-admin-net

networks:
  callzo-admin-net:
    driver: bridge
